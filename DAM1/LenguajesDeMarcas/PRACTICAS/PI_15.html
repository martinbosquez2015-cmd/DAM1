<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <h1>Formulario de pago</h1>
        <p>(Los campos obligatorios se han marcado con *)</p>
        <div>
            <form action="nose.html" method="post">
                <fieldset>
                    <legend>Información de contacto</legend>
                    <div>
                        <label for="prof">Profesión</label>
                        <br>
                        <input type="radio" name="prof" value="Profesor">Profesor
                        <br>
                        <input type="radio" name="prof" value="Estudiante">Estudiante
                        <br>
                        <input type="radio" name="prof" value="Otro">Otro
                    </div>
                    <label for="name">Nombre<span>*</span></label>
                    <input type="text" name="name" required>
                    <br>
                    <label for="mail">Correo<span>*</span></label>
                    <input type="email" name="mail" id="e_mail" required>
                    <br>
                    <label for="tel">Numero de teléfono<span>*</span></label>
                    <input type="tel" pattern="[67]{1}[0-9]{8}" name="telef" required>
                    <br>
                    <label for="password">Contraseña</label>
                    <input type="password" name="password" required>
                </fieldset>
                <fieldset>
                    <legend>Información de pago</legend>
                    <label for="p_type">Tipo de tarjeta:</label>
                    <select name="p_type" id="paymentType">
                        <option value="visa">Visa</option>
                        <option value="mc">MasterCard</option>
                        <option value="nose">Nose</option>

                    </select>
                    <br>
                    <label for="num_t">Número de tarjeta:</label>
                    <input type="text" name="num_t" pattern="[0-9]{15-16}||[0-9]{19}" required>
                    
                </fieldset>
                <button type="submit"> asdwadasdwasdwa</button>
            </form>
        </div>
    </div>
</body>
</html>
